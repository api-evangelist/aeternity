limit_count: 7
http_limit_count: 0
note: >-
  http_limit_count is 0 on purpose: æternity publishes no request-per-second/per-hour HTTP quota for
  mainnet.aeternity.io, no terms of use for the public gateway, and no header from which one could be read.
  Every limit recorded above is a WebSocket/GraphQL/gas ceiling documented as a configuration default in the
  provider's own repository, not a quota the gateway advertises at runtime. An agent should treat 503 +
  Retry-After as the only authoritative throttling signal.
