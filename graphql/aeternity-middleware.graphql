  Statistics over time of transactions count
  """
  transactionsStats(cursor: String, direction: Direction = BACKWARD, intervalBy: StatsInterval = DAY, limit: Int, maxStartDate: String, minStartDate: String, txType: String): StartEndCountStatsPage
  """
  Get transfers with optional filters
  """
