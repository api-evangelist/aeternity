type RootQueryType {
  """
  Fetch a single account by id
  """
  account(id: String!): Account
  """
  Account activities
  """
  accountActivities(cursor: String, direction: Direction = BACKWARD, fromHeight: Int, id: String!, limit: Int, ownedOnly: Boolean, toHeight: Int, type: ActivityType): AccountActivityPage
  """
  Fetch account name claims
  """
  accountNameClaims(accountId: String!, cursor: String, direction: Direction = BACKWARD, fromHeight: Int, limit: Int, toHeight: Int): NameClaimPage
  """
  Fetch account name pointees
  """
  accountNamePointees(accountId: String!, cursor: String, direction: Direction = BACKWARD, fromHeight: Int, limit: Int, toHeight: Int): PointeePage
  """
  Get DEX swaps for a specific account
  """
  accountSwaps(accountId: String!, cursor: String, direction: Direction = BACKWARD, fromHeight: Int, limit: Int, toHeight: Int, tokenSymbol: String): SwapPage
  """
  Get detailed transaction counts for an account
  """
  accountTransactionsCount(id: String!, type: String, typeGroup: String): JSON
  """
  Statistics over time of active accounts count
  """
  activeAccountsStats(cursor: String, direction: Direction = BACKWARD, intervalBy: StatsInterval = DAY, limit: Int): StartEndCountStatsPage
  """
  Get all AEX141 tokens owned by an account
  """
  aex141AccountTokens(accountId: String!, contract: String, cursor: String, direction: Direction = BACKWARD, limit: Int): Aex141TokenPage
  """
  Fetch an AEX141 contract by id
  """
  aex141Contract(id: String!): Aex141Contract
  """
  Get all tokens for a specific template in an AEX141 contract
  """
  aex141ContractTemplateTokens(contractId: String!, cursor: String, direction: Direction = BACKWARD, limit: Int, templateId: Int!): Aex141TemplateTokenPage
  """
  Get all templates in an AEX141 contract
  """
  aex141ContractTemplates(contractId: String!, cursor: String, direction: Direction = BACKWARD, limit: Int): Aex141TemplatePage
  """
  Get information about the a specific AEX141 token
  """
  aex141ContractToken(contractId: String!, tokenId: String!): Aex141TokenWithMetadata
  """
  Get all tokens in an AEX141 contract
  """
  aex141ContractTokens(contractId: String!, cursor: String, direction: Direction = BACKWARD, limit: Int): Aex141TokenPage
  """
  Fetch AEX141 transfers for a specific contract
  """
  aex141ContractTransfers(contractId: String!, cursor: String, direction: Direction = BACKWARD, from: String, limit: Int, to: String): Aex141TransferPage
  """
  List AEX141 contracts
  """
  aex141Contracts(cursor: String, direction: Direction = BACKWARD, exact: String, limit: Int, orderBy: Aex141ContractOrderBy = CREATION, prefix: String): Aex141ContractPage
  """
  AEX141 contracts count
  """
  aex141Count: Int
  """
  Fetch AEX141 transfers
  """
  aex141Transfers(cursor: String, direction: Direction = BACKWARD, from: String, limit: Int, to: String): Aex141TransferPage
  """
  Get all AEX9 token balances for an account
  """
  aex9AccountBalances(accountId: String!, cursor: String, direction: Direction = BACKWARD, limit: Int): Aex9AccountBalancePage
  """
  AEX9 balance history for an account on a contract
  """
  aex9BalanceHistory(accountId: String!, contractId: String!, cursor: String, direction: Direction = BACKWARD, fromHeight: Int, limit: Int, toHeight: Int): Aex9BalanceHistoryItemPage
  """
  Fetch an AEX9 creation and meta_info information by contract id
  """
  aex9Contract(id: String!): Aex9Contract
  """
  Balances within an AEX9 contract
  """
  aex9ContractBalances(blockHash: String, cursor: String, direction: Direction = BACKWARD, id: String!, limit: Int, orderBy: Aex9BalanceOrderBy = PUBKEY): Aex9ContractBalancePage
  """
  Fetch AEX9 transfers for a specific contract
  """
  aex9ContractTransfers(account: String, contractId: String!, cursor: String, direction: Direction = BACKWARD, limit: Int, recipient: String, sender: String): Aex9TransferPage
  """
  Get AEX9 tokens sorted by creation time, name or symbol
  """
  aex9Contracts(cursor: String, direction: Direction = BACKWARD, exact: String, limit: Int, orderBy: Aex9ContractOrderBy = CREATION, prefix: String): Aex9ContractPage
  """
  AEX9 contracts count
  """
  aex9Count: Int
  """
  Get AEX9 token balance for a specific account on a contract
  """
  aex9TokenBalance(accountId: String!, contractId: String!, hash: String): Aex9Balance
  """
  Statistics over time of AEX9 transfers count
  """
  aex9TransfersStats(cursor: String, direction: Direction = BACKWARD, intervalBy: StatsInterval = DAY, limit: Int, maxStartDate: String, minStartDate: String): StartEndCountStatsPage
  """
  Fetch a single auction
  """
  auction(id: String!): Auction
  """
  Fetch auction claims
  """
  auctionClaims(cursor: String, direction: Direction = BACKWARD, fromHeight: Int, id: String!, limit: Int, toHeight: Int): NameClaimPage
  """
  Fetch auctions
  """
  auctions(cursor: String, direction: Direction = BACKWARD, limit: Int, orderBy: AuctionOrder = EXPIRATION): AuctionPage
  """
  Statistics over time of blocks count
  """
  blocksStats(cursor: String, direction: Direction = BACKWARD, intervalBy: StatsInterval = DAY, limit: Int, maxStartDate: String, minStartDate: String, type: BlockType): StartEndCountStatsPage
  """
  Fetch a single channel
  """
  channel(id: String!): Channel
  """
  Fetch all updates done to a channel
  """
  channelUpdates(cursor: String, direction: Direction = BACKWARD, fromHeight: Int, id: String!, limit: Int, toHeight: Int): ChannelUpdatePage
  """
  Get multiple channels
  """
  channels(cursor: String, direction: Direction = BACKWARD, fromHeight: Int, limit: Int, state: ChannelState, toHeight: Int): ChannelPage
  """
  Contract by id
  """
  contract(id: String!): Contract
  """
  Contract calls for a specific contract
  """
  contractCalls(cursor: String, direction: Direction = BACKWARD, fromHeight: Int, id: String!, limit: Int, toHeight: Int): ContractCallPage
  """
  Contract logs for a specific contract
  """
  contractLogs(aexnArgs: Boolean, cursor: String, data: String, direction: Direction = BACKWARD, event: String, fromHeight: Int, function: String, functionPrefix: String, id: String!, limit: Int, toHeight: Int): ContractLogPage
  """
  Get DEX swaps for a specific contract
  """
  contractSwaps(contractId: String!, cursor: String, direction: Direction = BACKWARD, fromHeight: Int, limit: Int, toHeight: Int): SwapPage
  """
  Contracts
  """
  contracts(cursor: String, direction: Direction = BACKWARD, fromHeight: Int, limit: Int, toHeight: Int): ContractPage
  """
  Contract calls
  """
  contractsCalls(cursor: String, direction: Direction = BACKWARD, fromHeight: Int, limit: Int, toHeight: Int): ContractCallPage
  """
  Contract logs
  """
  contractsLogs(aexnArgs: Boolean, contractId: String, cursor: String, data: String, direction: Direction = BACKWARD, event: String, fromHeight: Int, function: String, functionPrefix: String, limit: Int, toHeight: Int): ContractLogPage
  """
  Statistics over time of contracts count
  """
  contractsStats(cursor: String, direction: Direction = BACKWARD, intervalBy: StatsInterval = DAY, limit: Int, maxStartDate: String, minStartDate: String): StartEndCountStatsPage
