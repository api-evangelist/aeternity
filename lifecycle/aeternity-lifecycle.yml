sla:
  published: false
  detail: >-
    No SLA, uptime commitment or support tier is published for the public mainnet.aeternity.io gateway. The
    node is open source and self-hostable — the documented posture is "run your own node" (external HTTP API
    on 127.0.0.1:3013), and the public gateway is a convenience the project operates rather than a contracted
    service.
