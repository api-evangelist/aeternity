        - 491255227
        - 530197445
        - 533633643
        prev_hash: kh_hwin2p8u87mqiK836FixGa1pL9eBkL1Ju37Yi6EUebCgAf8rm
        prev_key_hash: kh_hwin2p8u87mqiK836FixGa1pL9eBkL1Ju37Yi6EUebCgAf8rm
        state_hash: bs_9Dg6mTmiJLpbg9dzgjnNFVidQesvZYZG3dEviUCd4oE1hUcna
        target: 504082055
        time: 1565548832164
        transactions_count: 2
        version: 3
      title: Key Block Extended
      allOf:
      - $ref: '#/components/schemas/KeyBlock'
      - type: object
        required:
        - beneficiary_reward
        - flags
        - micro_blocks_count
        - transactions_count
        properties:
          beneficiary_reward:
            description: The beneficiary reward
            type: integer
          flags:
            $ref: '#/components/schemas/ByteArray'
          micro_blocks_count:
            description: The number of micro blocks
            type: integer
          transactions_count:
            description: The number of transactions
            type: integer
    ByteArray:
      type: string
      example: ba_wAAAAKv2ZV4=
      pattern: ^ba_\w+$
    EncodedPubkey:
      description: Base58Check encoded tagged pubkey
      type: string
    KeyBlock:
      type: object
      properties:
        hash:
          $ref: '#/components/schemas/EncodedHash'
        height:
          $ref: '#/components/schemas/UInt64'
        prev_hash:
          $ref: '#/components/schemas/EncodedHash'
        prev_key_hash:
          $ref: '#/components/schemas/EncodedHash'
        state_hash:
          $ref: '#/components/schemas/EncodedHash'
        miner:
          $ref: '#/components/schemas/EncodedPubkey'
        beneficiary:
          $ref: '#/components/schemas/EncodedPubkey'
        flags:
          $ref: '#/components/schemas/EncodedByteArray'
        target:
          $ref: '#/components/schemas/UInt32'
        pow:
          $ref: '#/components/schemas/Pow'
        nonce:
          $ref: '#/components/schemas/UInt64'
        time:
          $ref: '#/components/schemas/UInt64'
        version:
          $ref: '#/components/schemas/UInt32'
        info:
          $ref: '#/components/schemas/EncodedContractByteArray'
      required:
      - hash
      - height
      - prev_hash
      - prev_key_hash
      - state_hash
      - miner
      - beneficiary
      - target
      - time
      - version
      - info
    EncodedContractByteArray:
      description: Base64Check encoded contract byte array
      type: string
      example: cb_AAAAAfy4hFE=
      pattern: ^cb_[0-9A-Za-z+/=]+$
    EncodedByteArray:
      description: Base64Check encoded byte array
      type: string
      example: ba_AAAAAfy4hFE=
      pattern: ^ba_[0-9A-Za-z+/=]+$
    UInt32:
      oneOf:
      - type: integer
        minimum: 0
        maximum: 4294967295
      - type: string
    PaginatedResponse:
      type: object
      properties:
        next:
          type:
          - string
          - 'null'
          example: /blocks?cursor=123
        prev:
          type:
          - string
          - 'null'
          example: /blocks?cursor=234
      required:
      - next
      - prev
    UInt64:
      oneOf:
      - type: integer
        minimum: 0
        maximum: 18446744073709552000
      - type: string
  parameters:
    ScopeParam:
      in: query
      name: scope
      description: Scopes results in a generation range
      schema:
        type: string
        pattern: (gen):\d+(-\d+)?
    DirectionParam:
      in: query
      name: direction
      description: Sorts results in forwards or backwards direction
      schema:
        type: string
        enum:
        - forward
        - backward
    LimitParam:
      in: query
      name: limit
      description: Limit paginated resources (max 100)
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
