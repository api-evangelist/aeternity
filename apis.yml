aid: aeternity
name: Aeternity
description: >-
  æternity is an open-source layer-1 blockchain platform, launched in 2018 and stewarded by the Aeternity
  Foundation, whose protocol ships two public, unauthenticated HTTP APIs: the æternity node API (OpenAPI 3.0,
  79 operations across chain, transaction, account, contract, oracle, naming-system, state-channel and
  node-operator surfaces) and the æternity Middleware (ae_mdw) API (OpenAPI 3.0, 76 REST operations plus an
  open GraphQL endpoint with 85 query fields and a WebSocket subscription stream). The platform adds the
  Sophia smart-contract language, the FATE virtual machine, state channels, protocol-native oracles, the
  æternity Naming System (AENS) and Hyperchains, and is consumed through first-party JavaScript/TypeScript,
  CLI and calldata SDKs published to npm, plus the æScan explorer, ÆStudio IDE and Superhero wallet/DEX.
