apis:
- name: Aeternity Node API
  description: >-
    The public HTTP API of the æternity node (v7.3.0) — 79 unauthenticated operations covering chain and
    generation queries, transaction submission and inspection, account state and nonces, contract calls and
    dry-run, oracles, the æternity Naming System, state channels, node status/peers and node-operator
    endpoints. Every response carries an X-Ae-Height header naming the chain top the answer reflects.
  humanURL: https://api-docs.aeternity.io/
  baseURL: https://mainnet.aeternity.io/v3
  tags:
