- name: Aeternity Middleware API
  description: >-
    ae_mdw, the æternity middleware (v1.108.2) — an indexing layer over the node exposing 76 unauthenticated
    REST operations for transactions, blocks, accounts, activities, AEX-9/AEX-141 tokens, DEX swaps, names
    and auctions, oracles, channels, transfers, wealth ranking and statistics, plus an open GraphQL endpoint
    (85 query fields, introspection enabled) and a WebSocket subscription stream for KeyBlocks, MicroBlocks,
    Transactions and per-object events.
  humanURL: https://docs.aeternity.com/aeternity-developer-tools/development-infrastructure/middleware
  baseURL: https://mainnet.aeternity.io/mdw/v3
