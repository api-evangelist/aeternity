    url: https://github.com/aeternity/ae_mdw/blob/master/CHANGELOG.md
  - type: Overlay
    url: overlays/aeternity-middleware-overlay.yaml
- name: Aeternity MCP Server
  description: >-
    A remote Model Context Protocol endpoint published on aeternity.com and advertised through RFC 9728
    protected-resource metadata and RFC 8414 authorization-server metadata. The endpoint is OAuth 2.1 gated
    (authorization_code + PKCE S256, single `mcp` scope, dynamic client registration via client-id metadata
    documents); an anonymous tools/list returns 401, so the tool set could not be enumerated.
  humanURL: https://aeternity.com/
  baseURL: https://aeternity.com/wp-json/mcp/mcp-oauth-server
  tags:
  - MCP
  - Agents
  - Blockchain
  tags_raw:
