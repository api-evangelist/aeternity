- id: aex-9
  name: 'AEX-9: Fungible Token Standard'
  conforms: true
  role: author-and-implementer
  evidence: >-
    The middleware contract exposes AEX-9 as a first-class resource family in the contract itself, not as
    prose: GET /aex9, /aex9/count, /aex9/{id}, /aex9/{contractId}/balances,
    /aex9/{contractId}/balances/{accountId}, /aex9/{contractId}/balances/{accountId}/history,
