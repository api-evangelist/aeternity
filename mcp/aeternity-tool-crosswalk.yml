mcp_only: []
graphql_only:
- field: account
  reason: Middleware v3 REST has no /accounts/{id} resource; the equivalent lives on the node API (GetAccountByPubkey),
    not the middleware.
- field: aex141Count
  reason: No REST /aex141/count endpoint; only the AEX-9 count is exposed over REST.
- field: aex141Transfers
  reason: REST exposes AEX-141 transfers only per contract (/aex141/{contractId}/transfers); the chain-wide list
    is GraphQL-only.
- field: aex9ContractTransfers
  reason: No REST /aex9/{contractId}/transfers endpoint in the v3 surface.
- field: channelUpdates
  reason: No REST endpoint for per-channel update history.
- field: contracts
  reason: No REST list-all-contracts endpoint; REST exposes only /contracts/{id}.
- field: nameHistory
  reason: No REST endpoint returning the full lifecycle history of a name.
- field: searchNames
  reason: No REST name-search endpoint.
- field: syncStatus
  reason: Sync state is folded into REST /status; GraphQL exposes it as a separate field.
- field: topMiners24hStats
  reason: REST exposes only /stats/miners/top (all-time); the 24h window is GraphQL-only.
- field: wealth
  reason: No REST /wealth endpoint; the wealth-rank index (WEALTH_RANK_SIZE, default 200) is GraphQL-only.
